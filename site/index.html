<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Season Tracker</title>
<meta name="description" content="Latest Formula 1 race result and championship standings, updated every Monday by a Databricks lakehouse pipeline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E6EAEE;      /* pit-lane concrete */
    --ink: #16202C;        /* deep slate */
    --tower: #1D2733;      /* timing tower panel */
    --tower-row: #253041;
    --rule: #C5CDD6;
    --muted: #5A6576;
    --purple: #9B5CFF;     /* F1 timing: purple = fastest */
    --gain: #1F8A57;
    --loss: #B4452A;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.5 var(--body);
    font-variant-numeric: tabular-nums;
  }
  a { color: inherit; text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }

  .page { max-width: 1120px; margin: 0 auto; padding: 32px 20px 56px; }

  /* ---------- Header ---------- */
  .masthead {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px; flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
  }
  .masthead h1 {
    font: 700 1.5rem/1 var(--display);
    margin: 0; letter-spacing: 0.01em;
  }
  .masthead p { margin: 0; color: var(--muted); font-size: 0.95rem; }

  /* ---------- Race hero ---------- */
  .race { margin-top: 40px; }
  .race-title {
    font: 700 clamp(2.75rem, 7vw, 5.25rem)/0.92 var(--display);
    margin: 0; letter-spacing: -0.01em;
  }
  .race-meta { margin: 12px 0 0; color: var(--muted); font-size: 1.05rem; }

  .race-grid {
    display: grid;
    grid-template-columns: minmax(300px, 380px) 1fr;
    gap: 48px;
    margin-top: 32px;
    align-items: start;
  }

  /* Timing tower: the one bold thing on the page */
  .tower {
    background: var(--tower);
    color: #fff;
    border-radius: 6px;
    padding: 8px 0;
    margin: 0;
    list-style: none;
  }
  .tower li {
    display: grid;
    grid-template-columns: 34px 4px 1fr auto 46px;
    align-items: center;
    column-gap: 10px;
    height: 32px;
    padding: 0 12px 0 6px;
  }
  .tower li:nth-child(even) { background: var(--tower-row); }
  .tower .pos {
    font: 600 1.05rem/1 var(--display);
    text-align: right; color: #C9D2DD;
  }
  .tower .stripe { width: 4px; height: 18px; border-radius: 2px; }
  .tower .code { font: 700 1.1rem/1 var(--display); letter-spacing: 0.04em; }
  .tower .code.fastest::after {
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--purple); margin-left: 7px;
    vertical-align: middle;
  }
  .tower .gap { font: 500 0.95rem/1 var(--display); color: #DCE3EB; text-align: right; }
  .tower .gap.out { color: #8D99A8; }
  .tower .delta { font: 500 0.85rem/1 var(--display); text-align: right; color: #8D99A8; }
  .tower .delta.up { color: #6FD3A0; }
  .tower .delta.down { color: #F0947C; }

  /* Race story */
  .story h2, .standings h2 {
    font: 700 1.6rem/1.1 var(--display);
    margin: 0 0 16px;
  }
  .podium { display: grid; gap: 0; margin: 0 0 28px; padding: 0; list-style: none; }
  .podium li {
    display: grid; grid-template-columns: 4.5rem 1fr auto;
    align-items: baseline; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--rule);
  }
  .podium li:last-child { border-bottom: 1px solid var(--rule); }
  .podium .place { font: 700 2.4rem/1 var(--display); }
  .podium .name { font: 600 1.35rem/1.15 var(--display); }
  .podium .team { display: block; font: 500 0.95rem/1.3 var(--body); color: var(--muted); }
  .podium .pts { font: 600 1.1rem/1 var(--display); color: var(--muted); }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin: 0; }
  .facts div { border-left: 4px solid var(--rule); padding-left: 14px; }
  .facts dt { color: var(--muted); font-size: 0.95rem; }
  .facts dd { margin: 4px 0 0; font: 600 1.35rem/1.2 var(--display); }
  .facts .purple { border-left-color: var(--purple); }
  .facts .green { border-left-color: var(--gain); }

  /* ---------- Standings ---------- */
  .standings-grid {
    display: grid; grid-template-columns: 1.35fr 1fr; gap: 56px;
    margin-top: 64px; padding-top: 28px; border-top: 2px solid var(--ink);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font: 500 0.9rem/1.2 var(--body); color: var(--muted);
    padding: 0 8px 8px; border-bottom: 1px solid var(--ink);
  }
  th.num, td.num { text-align: right; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  td.pos { font: 600 1.05rem/1 var(--display); width: 2.5rem; color: var(--muted); }
  td.driver .who { display: flex; align-items: center; gap: 10px; }
  td.driver .stripe { width: 4px; height: 26px; border-radius: 2px; flex: none; }
  td.driver .name { font-weight: 600; }
  td.driver .team { display: block; font-size: 0.875rem; color: var(--muted); line-height: 1.2; }
  td.pts { font: 700 1.15rem/1 var(--display); }
  tbody tr:first-child td.pos { color: var(--ink); }

  .bars { list-style: none; margin: 0; padding: 0; }
  .bars li { padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .bars .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bars .team { font-weight: 600; }
  .bars .team span { color: var(--muted); font: 600 1rem/1 var(--display); margin-right: 8px; }
  .bars .pts { font: 700 1.15rem/1 var(--display); }
  .bars .track { height: 8px; margin-top: 7px; background: #D5DCE3; border-radius: 4px; overflow: hidden; }
  .bars .fill { height: 100%; border-radius: 4px; transform-origin: left; }
  @media (prefers-reduced-motion: no-preference) {
    .bars .fill { animation: grow 700ms cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } }
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 0.95rem; max-width: 70ch;
  }
  footer p { margin: 0 0 8px; }

  .error { margin-top: 48px; font-size: 1.1rem; }

  @media (max-width: 860px) {
    .race-grid, .standings-grid { grid-template-columns: 1fr; gap: 40px; }
    .tower { max-width: 420px; }
  }
  @media (max-width: 520px) {
    .col-podiums { display: none; }
    td, th { padding-left: 4px; padding-right: 4px; }
    .podium li { grid-template-columns: 3.75rem 1fr auto; }
    .podium .place { font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1 id="season-title">F1 season tracker</h1>
    <p id="updated"></p>
  </header>

  <main id="app" aria-live="polite">
    <p class="error" id="loading">Loading the latest race…</p>
  </main>

  <footer>
    <p>Data from <a href="https://openf1.org">OpenF1</a>. Not affiliated with Formula 1.</p>
    <p>Updated every Monday after a race weekend by a Databricks lakehouse pipeline: OpenF1 API, bronze, silver, gold, validation, then this page. <a href="https://github.com/petterr-n/f1-lakehouse">Source on GitHub</a>.</p>
  </footer>
</div>

<script>
const STATUS = { retired: "DNF", did_not_start: "DNS", disqualified: "DSQ" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fullName = (d) => `${d.first_name} ${d.last_name}`;
const pts = (p) => Number.isInteger(p) ? p : Number(p).toLocaleString("en-GB", { maximumFractionDigits: 1 });
const ordinal = (n) => {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};
const lapTime = (sec) => {
  if (sec == null) return "";
  const m = Math.floor(sec / 60), s = (sec - m * 60).toFixed(3).padStart(6, "0");
  return `${m}:${s}`;
};
const raceDate = (s) => new Date(s.replace(" ", "T") + "Z")
  .toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

function gapText(r) {
  if (STATUS[r.status]) return STATUS[r.status];
  if (r.finish_order === 1) return "Winner";
  if (r.laps_behind > 0) return `+${r.laps_behind} lap${r.laps_behind > 1 ? "s" : ""}`;
  if (r.gap_to_leader_sec != null) return `+${r.gap_to_leader_sec.toFixed(1)}s`;
  return "";
}

function deltaCell(r) {
  const g = r.positions_gained;
  if (g == null || g === 0) return `<span class="delta" aria-label="no change">–</span>`;
  const up = g > 0;
  return `<span class="delta ${up ? "up" : "down"}" aria-label="${up ? "gained" : "lost"} ${Math.abs(g)} places from grid">${up ? "▲" : "▼"}${Math.abs(g)}</span>`;
}

function render(data) {
  const race = data.latest_race;
  const res = race.results;
  const fastest = res.find((r) => r.has_fastest_lap);
  const climber = res
    .filter((r) => r.positions_gained != null)
    .reduce((best, r) => (best == null || r.positions_gained > best.positions_gained ? r : best), null);

  document.getElementById("season-title").textContent = `F1 ${data.season} season tracker`;
  document.getElementById("updated").textContent =
    `Updated ${new Date(data.generated_at).toLocaleDateString("en-GB", { day: "numeric", month: "long" })}`;
  document.title = `F1 ${data.season}: ${race.meeting_name}`;

  const tower = res.map((r) => `
    <li>
      <span class="pos">${r.position ?? ""}</span>
      <span class="stripe" style="background:${esc(r.team_colour)}"></span>
      <span class="code${r.has_fastest_lap ? " fastest" : ""}" title="${esc(fullName(r))}, ${esc(r.team_name)}">${esc(r.name_acronym)}</span>
      <span class="gap${STATUS[r.status] ? " out" : ""}">${gapText(r)}</span>
      ${deltaCell(r)}
    </li>`).join("");

  const podium = res.slice(0, 3).map((r, i) => `
    <li>
      <span class="place">${ordinal(i + 1)}</span>
      <span class="name">${esc(fullName(r))}<span class="team">${esc(r.team_name)}</span></span>
      <span class="pts">${pts(r.points)} pts</span>
    </li>`).join("");

  const facts = [];
  if (fastest) facts.push(`<div class="purple"><dt>Fastest lap</dt><dd>${esc(fastest.last_name)}, ${lapTime(fastest.best_lap_sec)}</dd></div>`);
  if (climber && climber.positions_gained > 0) facts.push(`<div class="green"><dt>Biggest climber</dt><dd>${esc(climber.last_name)}, ${ordinal(climber.grid_position)} to ${ordinal(climber.position)}</dd></div>`);
  const dnf = res.filter((r) => STATUS[r.status]).length;
  facts.push(`<div><dt>Did not finish</dt><dd>${dnf} of ${res.length} cars</dd></div>`);

  const drivers = data.driver_standings.map((d) => `
    <tr>
      <td class="pos">${d.position}</td>
      <td class="driver"><div class="who">
        <span class="stripe" style="background:${esc(d.team_colour)}"></span>
        <span><span class="name">${esc(fullName(d))}</span><span class="team">${esc(d.team_name)}</span></span>
      </div></td>
      <td class="num">${d.wins}</td>
      <td class="num col-podiums">${d.podiums}</td>
      <td class="num pts">${pts(d.points)}</td>
    </tr>`).join("");

  const leaderPts = Math.max(...data.constructor_standings.map((c) => c.points), 1);
  const teams = data.constructor_standings.map((c, i) => `
    <li>
      <div class="row">
        <span class="team"><span>${c.position}</span>${esc(c.team_name)}</span>
        <span class="pts">${pts(c.points)}</span>
      </div>
      <div class="track" aria-hidden="true">
        <div class="fill" style="width:${(c.points / leaderPts) * 100}%;background:${esc(c.team_colour)};animation-delay:${i * 40}ms"></div>
      </div>
    </li>`).join("");

  document.getElementById("app").innerHTML = `
    <section class="race" aria-labelledby="race-title">
      <h2 class="race-title" id="race-title">${esc(race.meeting_name)}</h2>
      <p class="race-meta">Round ${race.round_number} of the ${race.year} season, ${esc(race.location)}, ${raceDate(race.date_start)}</p>

      <div class="race-grid">
        <ol class="tower" aria-label="Race result">${tower}</ol>

        <div class="story">
          <h2>Podium</h2>
          <ol class="podium">${podium}</ol>
          <dl class="facts">${facts.join("")}</dl>
        </div>
      </div>
    </section>

    <div class="standings-grid">
      <section class="standings" aria-labelledby="drivers-title">
        <h2 id="drivers-title">Drivers' championship</h2>
        <table>
          <thead><tr><th>Pos</th><th>Driver</th><th class="num">Wins</th><th class="num col-podiums">Podiums</th><th class="num">Points</th></tr></thead>
          <tbody>${drivers}</tbody>
        </table>
      </section>

      <section class="standings" aria-labelledby="teams-title">
        <h2 id="teams-title">Constructors' championship</h2>
        <ol class="bars">${teams}</ol>
      </section>
    </div>`;
}

fetch("data/f1_site_data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById("app").innerHTML =
      `<p class="error">The race data didn't load. Reload the page, or check back after the next update.</p>`;
  });
</script>
</body>
</html>
