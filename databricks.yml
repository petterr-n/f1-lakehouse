bundle:
  name: f1_lakehouse

include:
  - resources/*.yml

variables:
  schema:
    description: Schema the pipeline writes its tables to
    default: pipeline_dev
  live_schema:
    description: Schema for the live replay pipeline
    default: live_dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d9b08dbc-82b6.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-d9b08dbc-82b6.cloud.databricks.com
      root_path: /Workspace/Users/prn@silverliningit.no/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: pipeline
      live_schema: live_replay
    permissions:
      - user_name: prn@silverliningit.no
        level: CAN_MANAGE