name: Publish site

on:
  schedule:
    - cron: "0 14 * * 1"        # Mondays 14:00 UTC, after the 14:00 Oslo job has finished
  workflow_dispatch:            # "Run workflow" button for manual updates
  push:
    branches: [main]
    paths: ["web/**"]           # republish when the page itself changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Download validated site data
        run: |
          mkdir -p web/public/data
          for f in races.json qualifying.json standings.json; do
            databricks fs cp "dbfs:/Volumes/f1/pipeline/exports/site/$f" web/public/data/ --overwrite
          done
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4