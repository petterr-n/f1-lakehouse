resources:
  jobs:
    f1_weekly:
      name: f1_weekly

      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/ingest_openf1.py
            base_parameters:
              years: ""
          max_retries: 2
          min_retry_interval_millis: 600000      # 10 minutes

        - task_key: transform
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.f1_openf1_pipeline.id}

        - task_key: validate
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../notebooks/validate.py
            base_parameters:
              schema: ${var.schema}
        
        - task_key: export
          depends_on:
            - task_key: validate
          notebook_task:
            notebook_path: ../notebooks/export_site_data.py
            base_parameters:
              schema: ${var.schema}

      schedule:
        quartz_cron_expression: "0 0 10 ? * MON"
        timezone_id: Europe/Oslo

      email_notifications:
        on_failure:
          - prn@silverliningit.no