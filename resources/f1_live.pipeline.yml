resources:
  schemas:
    live:
      catalog_name: f1
      name: ${var.live_schema}
      comment: Live (replay) race data, separate from the weekly pipeline

  pipelines:
    f1_live_pipeline:
      name: f1_live_pipeline
      catalog: f1
      schema: ${resources.schemas.live.name}
      serverless: true
      configuration:
        source_schema: ${var.schema}   # where silver_session_drivers lives
      libraries:
        - file:
            path: ../pipelines/live/live.sql